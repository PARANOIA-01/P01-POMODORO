name: App Android (APK)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm ci

      - name: Copiar la app web a Android
        run: npx cap sync android

      - name: Preparar la llave de firma
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          # Usa la llave de los secretos de GitHub si existe; si no, la del repositorio.
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
          else
            echo "ANDROID_KEYSTORE_PATH=$GITHUB_WORKSPACE/android/firma/p01-pomodoro.jks" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$(cat android/firma/clave.txt)" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=pomodoro" >> "$GITHUB_ENV"
          fi

      - name: Armar el APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Leer la versión
        id: v
        run: echo "name=$(grep -oP 'versionName "\K[^"]+' android/app/build.gradle)" >> "$GITHUB_OUTPUT"

      - name: Renombrar el APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "P01-POMODORO_V${{ steps.v.outputs.name }}.apk"

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.name }}
          name: P01-POMODORO_V${{ steps.v.outputs.name }}
          body: Descarga el archivo .apk desde tu celular Android para instalar o actualizar la app.
          files: P01-POMODORO_V${{ steps.v.outputs.name }}.apk
          make_latest: true
