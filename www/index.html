<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>P01-POMODORO</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css?v=1.3">
</head>
<body>
<div class="app">
  <div class="banner" id="banner" hidden>
    <p id="banner-text"></p>
    <button type="button" id="banner-btn"></button>
  </div>

  <div class="phase" id="phase"><b>Concentración</b></div>

  <svg class="tomato" viewBox="0 0 300 300" role="img" aria-label="Reloj de tomate">
    <ellipse cx="150" cy="168" rx="128" ry="118" fill="var(--tomato)"/>
    <ellipse cx="108" cy="130" rx="26" ry="16" fill="#FFFFFF" opacity="0.18" transform="rotate(-30 108 130)"/>
    <g id="dial">
      <circle cx="150" cy="168" r="84" fill="var(--dial)"/>
      <g id="ticks"></g>
    </g>
    <circle cx="150" cy="168" r="44" fill="var(--tomato)"/>
    <g fill="var(--leaf)">
      <path d="M150 52 C130 40 112 44 100 54 C118 56 132 60 150 62 Z"/>
      <path d="M150 52 C170 40 188 44 200 54 C182 56 168 60 150 62 Z"/>
      <path d="M150 54 C142 44 140 34 146 24 C150 34 156 42 156 54 Z"/>
      <rect x="146" y="30" width="8" height="26" rx="4"/>
    </g>
    <path d="M150 96 L143 78 L157 78 Z" fill="var(--fg)"/>
  </svg>

  <div class="time" id="time">25:00</div>
  <div class="round" id="round">Ronda 1 de 4</div>

  <div class="controls">
    <button type="button" class="primary" id="start">Empezar</button>
    <button type="button" id="skip">Saltar</button>
    <button type="button" id="reset">Reiniciar</button>
  </div>

  <div class="today">Rondas de hoy: <b id="today">0</b></div>

  <section class="settings" aria-label="Ajustes">
    <h2>Ajustes</h2>
    <div class="row">
      <label for="in-focus">Concentración<small>minutos</small></label>
      <div class="stepper"><button type="button" data-step="focus" data-d="-1" aria-label="Menos">−</button><input id="in-focus" type="number" min="1" max="120" inputmode="numeric"><button type="button" data-step="focus" data-d="1" aria-label="Más">+</button></div>
    </div>
    <div class="row">
      <label for="in-break">Descanso<small>minutos</small></label>
      <div class="stepper"><button type="button" data-step="brk" data-d="-1" aria-label="Menos">−</button><input id="in-break" type="number" min="1" max="60" inputmode="numeric"><button type="button" data-step="brk" data-d="1" aria-label="Más">+</button></div>
    </div>
    <div class="row">
      <label for="in-long">Descanso largo<small id="long-hint">El doble del descanso</small></label>
      <div class="stepper"><button type="button" data-step="long" data-d="-1" aria-label="Menos">−</button><input id="in-long" type="number" min="1" max="120" inputmode="numeric"><button type="button" data-step="long" data-d="1" aria-label="Más">+</button></div>
    </div>
    <div class="row">
      <label for="in-rounds">Rondas antes del descanso largo</label>
      <div class="stepper"><button type="button" data-step="rounds" data-d="-1" aria-label="Menos">−</button><input id="in-rounds" type="number" min="1" max="12" inputmode="numeric"><button type="button" data-step="rounds" data-d="1" aria-label="Más">+</button></div>
    </div>
    <p class="note">Vibra 30 segundos antes de que termine Concentración y suena una alarma al terminar cada temporizador, aunque el celular esté bloqueado o en vibración.</p>
  </section>

  <div class="version">P01-POMODORO · <span id="version"></span></div>
</div>
<script src="app.js?v=1.3"></script>
</body>
</html>
